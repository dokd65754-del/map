<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>خريطة عملائي</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen vector map, floating search on top, action buttons on the right, one bottom sheet for card / form / settings. */
:root{
  --panel:#ffffff;
  --ink:#1c2326;
  --muted:#5d6a70;
  --line:#dde3e5;
  --chip:#eef2f3;
  --accent:#d9480f;
  --accent-ink:#ffffff;
  --danger:#c92a2a;
  --ok:#2b8a3e;
  --shadow:0 6px 24px rgba(15,25,30,.22);
  --sans:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --panel:#1b2226;
    --ink:#eaf0f2;
    --muted:#9aaab1;
    --line:#2e3a40;
    --chip:#263137;
    --accent:#ff8a4c;
    --accent-ink:#1b1206;
    --danger:#ff6b6b;
    --ok:#69db7c;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:var(--sans);font-size:16px;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
#map{position:fixed;inset:0;direction:ltr;background:#cfd8dc}
.night canvas.maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.maplibregl-ctrl-attrib{font-size:10px}

/* top bar */
#top{position:fixed;z-index:1000;left:10px;right:10px;top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:8px}
#searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:0 12px;height:50px}
#searchbox svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:17px}
#q::placeholder{color:var(--muted)}
.iconbtn{flex:none;width:50px;height:50px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
#results{position:fixed;z-index:1000;left:10px;right:10px;top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);max-height:55vh;overflow:auto}
#results[hidden]{display:none}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:start;cursor:pointer;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:active{background:var(--chip)}
.res .rc{flex:none;min-width:46px;text-align:center;font-family:var(--mono);font-weight:700;font-size:20px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 8px;direction:ltr}
.res .rt{min-width:0;display:flex;flex-direction:column;gap:2px}
.res .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rm{font-size:13px;color:var(--muted);direction:ltr;text-align:start}
.nores{padding:14px;display:flex;flex-direction:column;gap:10px}
.nores p{margin:0;color:var(--muted)}

/* floating actions */
#fabs{position:fixed;z-index:1000;right:12px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center}
#fabs .iconbtn{width:52px;height:52px}
#add{width:64px!important;height:64px!important;border-radius:20px!important;background:var(--accent);color:var(--accent-ink)}
body.sheet-open #fabs,body.picking #fabs{display:none}

#hint{position:fixed;z-index:900;left:12px;right:90px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink)}
#hint[hidden],body.sheet-open #hint,body.picking #hint{display:none}

#pickbar{position:fixed;z-index:1100;left:10px;right:10px;top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);background:var(--accent);color:var(--accent-ink);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;font-weight:500}
body.picking #pickbar{display:flex}
body.picking #map{cursor:crosshair}
#pickbar button{border:0;border-radius:10px;padding:8px 12px;background:rgba(0,0,0,.18);color:inherit;cursor:pointer}

/* pins */
.pinwrap{cursor:pointer}
.pin{position:relative;display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--accent);color:var(--accent-ink);border:2px solid #fff;border-radius:12px;padding:3px 9px;box-shadow:0 2px 8px rgba(0,0,0,.35);font-family:var(--mono);font-weight:700;font-size:15px;line-height:1.3}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:var(--accent);border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateX(-50%) rotate(45deg)}
.pin i{display:none;font-style:normal;font-family:var(--sans);font-weight:500;font-size:13px;unicode-bidi:plaintext;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.z-hi .pin i{display:inline}
.pin.sel{background:#1c7ed6;color:#fff}
.pin.sel::after{background:#1c7ed6}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1c7ed6;border:3px solid #fff;box-shadow:0 0 0 3px rgba(28,126,214,.35)}
.draft-dot{width:20px;height:20px;border-radius:50%;background:#1c7ed6;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* bottom sheet */
#sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3);padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
@media (min-width:700px){#sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
#grab{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#grab span{width:40px;height:4px;border-radius:2px;background:var(--line);margin-inline:auto}
#closebtn{position:absolute;top:10px;left:12px;border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
h2{font-size:20px;margin:6px 0 12px}
.card-head{display:flex;align-items:center;gap:16px;padding-top:6px}
.bigcode{flex:none;direction:ltr;font-family:var(--mono);font-weight:700;font-size:64px;line-height:1;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 18px;min-width:112px;text-align:center}
.who{min-width:0}
.who h2{margin:0 0 6px;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0;color:var(--muted);font-size:15px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.codelabel{font-size:12px;color:var(--muted);margin-bottom:6px}
.note{margin:14px 0 0;padding:10px 12px;background:var(--chip);border-radius:12px;color:var(--ink);line-height:1.6}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);text-decoration:none;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;flex:1}
.btn.danger{color:var(--danger)}
.btn.danger.confirm{background:var(--danger);color:#fff;border-color:transparent}
.btn.wide{width:100%}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
label input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:17px;color:var(--ink);min-width:0}
label input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.locstat{font-size:14px;color:var(--muted)}
.locstat.ok{color:var(--ok)}
.msg{margin:0;min-height:0;font-size:14px;color:var(--danger)}
.msg:empty{display:none}
.msg.warn{color:var(--ink);background:var(--chip);padding:8px 10px;border-radius:10px}
.setrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.setrow .btn{flex:1;min-width:140px}
.tips{margin:14px 0 0;padding:0 18px 0 0;color:var(--muted);font-size:14px;line-height:1.8}
#toast{position:fixed;z-index:1500;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#1c2326;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:var(--shadow)}
#toast[hidden]{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="searchbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ابحث بالإيركود أو الاسم أو رقم المنزل" aria-label="بحث">
  </div>
  <button class="iconbtn" id="settingsbtn" aria-label="الإعدادات والنسخ الاحتياطي">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</div>
<div id="results" hidden></div>
<div id="pickbar"><span>اضغط على المنزل في الخريطة</span><button id="pickcancel">إلغاء</button></div>

<div id="hint" hidden>لا يوجد عملاء بعد. اضغط زر + لإضافة أول عميل، أو اضغط مطولاً على المنزل في الخريطة.</div>

<div id="fabs">
  <button class="iconbtn" id="locbtn" aria-label="موقعي الحالي">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="iconbtn" id="layerbtn" aria-label="تغيير نوع الخريطة">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
  </button>
  <button class="iconbtn" id="add" aria-label="إضافة عميل">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="sheet" role="dialog" aria-modal="false">
  <button id="closebtn" aria-label="إغلاق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div id="grab"><span></span></div>
  <div id="sheetbody"></div>
</div>
<div id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
'use strict';

var KEY='ml_customers_v1', VIEWKEY='ml_view_v2', LAYERKEY='ml_layer_v1';
var DEFAULT_CENTER=[53.5259,-7.3381]; // Mullingar [lat,lng]
var customers=[];
var draft=null, currentId=null, picking=false, suppressClickUntil=0;
var markers={}, draftMarker=null, meMarker=null, watchId=null, lastPos=null;

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function normE(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function fmtE(s){var n=normE(s);return n.length>3?n.slice(0,3)+' '+n.slice(3):n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2600)}

function load(){
  try{var a=JSON.parse(lsGet(KEY)||'[]');customers=Array.isArray(a)?a:[]}catch(e){customers=[]}
}
function save(){
  if(!lsSet(KEY,JSON.stringify(customers)))toast('تعذر الحفظ على هذا المتصفح. صدّر نسخة احتياطية.');
}

/* ---------- map (vector, smooth) ---------- */
var osmStyle={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
var satStyle={version:8,sources:{sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri'}},layers:[{id:'sat',type:'raster',source:'sat'}]};
var STYLE_STREET='https://tiles.openfreemap.org/styles/liberty';
var STYLE_NIGHT='https://tiles.openfreemap.org/styles/dark';

var layerMode=parseInt(lsGet(LAYERKEY)||'0',10)||0; // 0 street, 1 satellite, 2 night
var layerNames=['خريطة','قمر صناعي','ليلي'];
var fallbackUsed=false;
function styleFor(m){
  if(fallbackUsed)return m===1?satStyle:osmStyle;
  return m===1?satStyle:(m===2?STYLE_NIGHT:STYLE_STREET);
}

var saved=null;
try{saved=JSON.parse(lsGet(VIEWKEY)||'null')}catch(e){}
var startC=saved&&saved.c?saved.c:DEFAULT_CENTER, startZ=saved&&saved.z?saved.z:14;

var map=new maplibregl.Map({
  container:'map',
  style:styleFor(layerMode),
  center:[startC[1],startC[0]],
  zoom:startZ,
  maxZoom:21,
  maxPitch:0,
  pitchWithRotate:false,
  touchPitch:false,
  attributionControl:false
});
map.dragRotate.disable();
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');

map.on('error',function(e){
  if(fallbackUsed||layerMode===1)return;
  if(map.isStyleLoaded())return;
  fallbackUsed=true;
  toast('تعذر تحميل الخريطة المتجهة، تم التحويل للخريطة العادية');
  map.setStyle(styleFor(layerMode));
  $('#map').classList.toggle('night',layerMode===2);
});

function applyLayer(){
  map.setStyle(styleFor(layerMode));
  $('#map').classList.toggle('night',fallbackUsed&&layerMode===2);
}

function updateZoomClass(){$('#map').classList.toggle('z-hi',map.getZoom()>=16)}
map.on('zoomend',updateZoomClass);updateZoomClass();
map.on('moveend',function(){var c=map.getCenter();lsSet(VIEWKEY,JSON.stringify({c:[c.lat,c.lng],z:map.getZoom()}))});

function focusOn(lat,lng,zoom,dur){
  var off=sheet.classList.contains('open')?[0,-Math.round(sheet.offsetHeight/2)]:[0,0];
  map.easeTo({center:[lng,lat],zoom:Math.max(map.getZoom(),zoom),offset:off,duration:dur==null?450:dur});
}

/* ---------- markers ---------- */
function pinEl(c,sel){
  var el=document.createElement('div');
  el.className='pinwrap';
  el.innerHTML='<div class="pin'+(sel?' sel':'')+'"><b>'+esc(c.code||'··')+'</b><i>'+esc(c.name)+'</i></div>';
  el.addEventListener('click',function(ev){ev.stopPropagation();if(!picking)openCard(c.id)});
  return el;
}
function renderMarkers(){
  Object.keys(markers).forEach(function(k){markers[k].m.remove()});
  markers={};
  customers.forEach(function(c){
    if(typeof c.lat!=='number'||typeof c.lng!=='number')return;
    var el=pinEl(c,c.id===currentId);
    var m=new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,-9]}).setLngLat([c.lng,c.lat]).addTo(map);
    markers[c.id]={m:m,el:el};
  });
  $('#hint').hidden=customers.length>0;
}
function selectMarker(id){
  Object.keys(markers).forEach(function(k){
    var p=markers[k].el.firstChild;
    if(p)p.classList.toggle('sel',k===id);
  });
}

/* ---------- sheet ---------- */
var sheet=$('#sheet'), body=$('#sheetbody');
function openSheet(){sheet.classList.add('open');document.body.classList.add('sheet-open')}
function closeSheet(){
  sheet.classList.remove('open');document.body.classList.remove('sheet-open');
  if(currentId){currentId=null;selectMarker(null)}
  clearDraftMarker();draft=null;
}
$('#closebtn').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(picking)cancelPick();else closeSheet()}});

/* ---------- card ---------- */
function openCard(id){
  var c=customers.find(function(x){return x.id===id});if(!c)return;
  clearDraftMarker();
  currentId=id;selectMarker(id);
  var nav='https://www.google.com/maps/dir/?api=1&destination='+c.lat+','+c.lng+'&travelmode=driving';
  body.innerHTML=
   '<div class="card-head">'+
     '<div><div class="codelabel">الكود</div><div class="bigcode" aria-label="كود التوصيل">'+esc(c.code||'--')+'</div></div>'+
     '<div class="who"><h2>'+esc(c.name)+'</h2><p class="meta">'+
       (c.house?'<span>منزل '+esc(c.house)+'</span>':'')+
       (c.eircode?'<span class="mono">'+esc(fmtE(c.eircode))+'</span>':'')+
     '</p></div>'+
   '</div>'+
   (c.note?'<p class="note">'+esc(c.note)+'</p>':'')+
   '<div class="actions">'+
     '<a class="btn primary" target="_blank" rel="noopener" href="'+nav+'">تنقّل</a>'+
     '<button class="btn" data-act="edit">تعديل</button>'+
     '<button class="btn danger" data-act="del">حذف</button>'+
   '</div>';
  openSheet();
  focusOn(c.lat,c.lng,17);
}

/* ---------- form ---------- */
function blankDraft(extra){
  var d={id:null,name:'',house:'',eircode:'',code:'',note:'',lat:null,lng:null,acc:null,dupOk:false};
  for(var k in extra)d[k]=extra[k];
  return d;
}
function openForm(d){
  draft=blankDraft(d||{});
  currentId=null;selectMarker(null);
  renderForm();openSheet();showDraftMarker(false);
}
function locText(){
  if(draft.lat==null)return {t:'لم يتم تحديد الموقع بعد',ok:false};
  return {t:'تم تحديد الموقع'+(draft.acc?' (دقة ±'+Math.round(draft.acc)+' م)':''),ok:true};
}
function renderForm(){
  var editing=!!draft.id, l=locText();
  body.innerHTML=
   '<h2>'+(editing?'تعديل عميل':'عميل جديد')+'</h2>'+
   '<form id="f" autocomplete="off" novalidate>'+
     '<label>الاسم<input id="f-name" type="text" value="'+esc(draft.name)+'" autocomplete="off"></label>'+
     '<div class="row2">'+
       '<label>رقم المنزل<input id="f-house" type="text" value="'+esc(draft.house)+'"></label>'+
       '<label>الكود (آخر رقمين)<input id="f-code" type="text" inputmode="numeric" maxlength="2" dir="ltr" value="'+esc(draft.code)+'"></label>'+
     '</div>'+
     '<label>الإيركود<input id="f-eir" type="text" dir="ltr" maxlength="8" autocapitalize="characters" placeholder="N91 AB12" value="'+esc(fmtE(draft.eircode))+'"></label>'+
     '<label>ملاحظة (اختياري)<input id="f-note" type="text" value="'+esc(draft.note)+'" placeholder="مثال: الباب الجانبي"></label>'+
     '<div class="loc"><div class="locstat'+(l.ok?' ok':'')+'" id="locstat">'+l.t+'</div>'+
       '<div class="row2"><button type="button" class="btn" data-act="gps">موقعي الحالي</button>'+
       '<button type="button" class="btn" data-act="pick">اختر من الخريطة</button></div></div>'+
     '<p class="msg" id="f-msg" role="alert"></p>'+
     '<button class="btn primary wide" type="submit">حفظ</button>'+
   '</form>';
}
function syncDraft(){
  if(!$('#f-name'))return;
  draft.name=$('#f-name').value.trim();
  draft.house=$('#f-house').value.trim();
  draft.code=$('#f-code').value.replace(/\D/g,'').slice(0,2);
  draft.eircode=normE($('#f-eir').value);
  draft.note=$('#f-note').value.trim();
}
function setMsg(t,warn){var m=$('#f-msg');if(!m)return;m.textContent=t||'';m.className='msg'+(warn?' warn':'')}
function refreshLocStat(){var s=$('#locstat');if(!s)return;var l=locText();s.textContent=l.t;s.className='locstat'+(l.ok?' ok':'')}

function showDraftMarker(fly){
  if(draft&&draft.lat!=null){
    var ll=[draft.lng,draft.lat];
    if(!draftMarker){
      var el=document.createElement('div');el.className='draft-dot';
      draftMarker=new maplibregl.Marker({element:el}).setLngLat(ll).addTo(map);
    }else draftMarker.setLngLat(ll);
    if(fly)focusOn(draft.lat,draft.lng,17);
  }
}
function clearDraftMarker(){if(draftMarker){draftMarker.remove();draftMarker=null}}

body.addEventListener('input',function(e){
  if(e.target.id==='f-eir'){
    var n=normE(e.target.value).slice(0,7);
    e.target.value=n.length>3?n.slice(0,3)+' '+n.slice(3):n;
  }else if(e.target.id==='f-code'){
    e.target.value=e.target.value.replace(/\D/g,'').slice(0,2);
  }
  if(draft)draft.dupOk=false;
});

body.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='edit'){
    var c=customers.find(function(x){return x.id===currentId});if(!c)return;
    openForm({id:c.id,name:c.name,house:c.house||'',eircode:c.eircode||'',code:c.code||'',note:c.note||'',lat:c.lat,lng:c.lng});
    showDraftMarker(true);
  }else if(act==='del'){
    if(!el.classList.contains('confirm')){el.classList.add('confirm');el.textContent='تأكيد الحذف';setTimeout(function(){if(el.isConnected){el.classList.remove('confirm');el.textContent='حذف'}},3500);return}
    customers=customers.filter(function(x){return x.id!==currentId});
    save();closeSheet();renderMarkers();toast('تم الحذف');
  }else if(act==='gps'){
    syncDraft();
    if(!navigator.geolocation){setMsg('الموقع غير مدعوم في هذا المتصفح');return}
    var s=$('#locstat');if(s)s.textContent='جارٍ تحديد موقعك…';
    navigator.geolocation.getCurrentPosition(function(p){
      draft.lat=p.coords.latitude;draft.lng=p.coords.longitude;draft.acc=p.coords.accuracy;
      refreshLocStat();showDraftMarker(true);
    },function(){refreshLocStat();setMsg('تعذر تحديد الموقع. فعّل خدمة الموقع للمتصفح.')},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }else if(act==='pick'){
    syncDraft();startPick();
  }else if(act==='export'){exportData()}
  else if(act==='wipe'){
    if(!el.classList.contains('confirm')){el.classList.add('confirm');el.textContent='اضغط مرة أخرى لحذف كل العملاء';setTimeout(function(){if(el.isConnected){el.classList.remove('confirm');el.textContent='حذف كل البيانات'}},3500);return}
    customers=[];save();renderMarkers();closeSheet();toast('تم حذف كل البيانات');
  }else if(act==='openexisting'){
    openCard(el.getAttribute('data-id'));
  }
});

body.addEventListener('submit',function(e){
  e.preventDefault();
  if(!draft||e.target.id!=='f')return;
  syncDraft();
  if(!draft.name&&!draft.eircode){setMsg('اكتب الاسم أو الإيركود');return}
  if(!draft.name){draft.name=fmtE(draft.eircode)}
  if(draft.lat==null){setMsg('حدد موقع المنزل: موقعي الحالي أو اختر من الخريطة');return}
  if(draft.code&&draft.code.length!==2){setMsg('الكود يجب أن يكون رقمين');return}
  if(draft.eircode&&draft.eircode.length!==7&&!draft.dupOk){setMsg('الإيركود عادة 7 خانات مثل N91 AB12. اضغط حفظ مرة ثانية للتأكيد.',true);draft.dupOk=true;return}
  if(!draft.id&&draft.eircode.length===7&&!draft.dupOk){
    var dup=customers.find(function(c){return normE(c.eircode)===draft.eircode});
    if(dup){
      var m=$('#f-msg');
      m.className='msg warn';
      m.innerHTML='هذا الإيركود محفوظ باسم '+esc(dup.name)+'. <button type="button" class="btn" data-act="openexisting" data-id="'+esc(dup.id)+'">فتح</button> أو اضغط حفظ للإضافة على أي حال.';
      draft.dupOk=true;return;
    }
  }
  var rec={id:draft.id||uid(),name:draft.name,house:draft.house,eircode:draft.eircode,code:draft.code,note:draft.note,lat:draft.lat,lng:draft.lng};
  if(draft.id){
    var i=customers.findIndex(function(c){return c.id===draft.id});
    if(i>=0){rec.created=customers[i].created;customers[i]=rec}else customers.push(rec);
  }else{rec.created=Date.now();customers.push(rec)}
  save();
  var id=rec.id;
  clearDraftMarker();draft=null;
  renderMarkers();
  openCard(id);
  toast('تم الحفظ');
});

/* ---------- pick on map ---------- */
function startPick(){
  picking=true;document.body.classList.add('picking');
  sheet.classList.remove('open');document.body.classList.remove('sheet-open');
}
function endPick(){
  picking=false;document.body.classList.remove('picking');
  renderForm();openSheet();showDraftMarker(false);
}
function cancelPick(){endPick()}
$('#pickcancel').addEventListener('click',cancelPick);
map.on('click',function(e){
  if(Date.now()<suppressClickUntil)return;
  if(picking){draft.lat=e.lngLat.lat;draft.lng=e.lngLat.lng;draft.acc=null;endPick();return}
  if(sheet.classList.contains('open'))closeSheet();
  hideResults();
});

/* long press (touch) and right click (desktop) to add a customer */
var lpTimer=null, lpStart=null;
function lpCancel(){clearTimeout(lpTimer);lpTimer=null}
map.on('touchstart',function(e){
  lpCancel();
  if(picking||!e.originalEvent||!e.originalEvent.touches||e.originalEvent.touches.length!==1)return;
  var ll=e.lngLat;lpStart=e.point;
  lpTimer=setTimeout(function(){
    lpTimer=null;
    suppressClickUntil=Date.now()+700;
    try{if(navigator.vibrate)navigator.vibrate(30)}catch(err){}
    openForm({lat:ll.lat,lng:ll.lng});
  },650);
});
map.on('touchmove',function(e){if(lpTimer&&lpStart&&e.point&&e.point.dist(lpStart)>8)lpCancel()});
['touchend','touchcancel','dragstart','zoomstart'].forEach(function(ev){map.on(ev,lpCancel)});
map.on('contextmenu',function(e){
  if(picking)return;
  openForm({lat:e.lngLat.lat,lng:e.lngLat.lng});
});

/* ---------- add ---------- */
$('#add').addEventListener('click',function(){openForm()});

/* ---------- locate ---------- */
function showMe(p){
  lastPos=[p.coords.latitude,p.coords.longitude];
  if(!meMarker){
    var el=document.createElement('div');el.className='me-dot';
    meMarker=new maplibregl.Marker({element:el}).setLngLat([lastPos[1],lastPos[0]]).addTo(map);
  }else meMarker.setLngLat([lastPos[1],lastPos[0]]);
}
$('#locbtn').addEventListener('click',function(){
  if(!navigator.geolocation){toast('الموقع غير مدعوم في هذا المتصفح');return}
  if(watchId==null){
    toast('جارٍ تحديد موقعك…');
    var first=true;
    watchId=navigator.geolocation.watchPosition(function(p){
      showMe(p);
      if(first){first=false;map.easeTo({center:[lastPos[1],lastPos[0]],zoom:Math.max(map.getZoom(),16),duration:600})}
    },function(){toast('تعذر تحديد الموقع. فعّل خدمة الموقع للمتصفح.');navigator.geolocation.clearWatch(watchId);watchId=null},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }else if(lastPos){map.easeTo({center:[lastPos[1],lastPos[0]],zoom:Math.max(map.getZoom(),16),duration:600})}
});

/* ---------- layers ---------- */
$('#layerbtn').addEventListener('click',function(){
  layerMode=(layerMode+1)%3;lsSet(LAYERKEY,String(layerMode));applyLayer();toast(layerNames[layerMode]);
});

/* ---------- search ---------- */
var qEl=$('#q'), resEl=$('#results');
function hideResults(){resEl.hidden=true}
function runSearch(){
  var raw=qEl.value.trim();
  if(!raw){hideResults();return}
  var ne=normE(raw), low=raw.toLowerCase();
  var hits=customers.filter(function(c){
    return (ne.length>=2&&normE(c.eircode).indexOf(ne)!==-1)||
           String(c.name||'').toLowerCase().indexOf(low)!==-1||
           String(c.house||'').toLowerCase()===low;
  }).slice(0,8);
  if(!hits.length){
    var link='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(raw+(ne.length>=7?' Ireland':' Mullingar'));
    resEl.innerHTML='<div class="nores"><p>لا يوجد عميل محفوظ بهذا البحث.</p>'+
      '<a class="btn" target="_blank" rel="noopener" href="'+link+'">ابحث في خرائط جوجل</a>'+
      '<button class="btn primary" id="addfromq">إضافة عميل جديد</button></div>';
    resEl.hidden=false;
    $('#addfromq').addEventListener('click',function(){
      var e=ne.length>=5&&/\d/.test(ne)?ne:'';
      hideResults();qEl.value='';qEl.blur();
      openForm(e?{eircode:e}:{name:raw});
    });
    return;
  }
  resEl.innerHTML=hits.map(function(c){
    return '<button class="res" data-id="'+esc(c.id)+'"><span class="rc">'+esc(c.code||'--')+'</span><span class="rt"><span class="rn">'+esc(c.name)+'</span><span class="rm">'+esc((c.house?'No. '+c.house+'  ':'')+fmtE(c.eircode))+'</span></span></button>';
  }).join('');
  resEl.hidden=false;
}
qEl.addEventListener('input',runSearch);
qEl.addEventListener('focus',runSearch);
qEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var first=resEl.querySelector('.res');
    if(first){first.click()}
    qEl.blur();
  }
});
resEl.addEventListener('click',function(e){
  var b=e.target.closest('.res');if(!b)return;
  hideResults();qEl.value='';qEl.blur();
  openCard(b.getAttribute('data-id'));
});

/* ---------- settings / backup ---------- */
function openSettings(){
  currentId=null;selectMarker(null);draft=null;clearDraftMarker();
  body.innerHTML=
   '<h2>النسخ الاحتياطي</h2>'+
   '<p class="meta" style="margin:0 0 12px">عدد العملاء المحفوظين: <b>'+customers.length+'</b>. البيانات محفوظة على هذا الهاتف فقط.</p>'+
   '<div class="setrow"><button class="btn primary" data-act="export">تصدير نسخة احتياطية</button>'+
   '<label class="btn" for="importfile" style="cursor:pointer">استيراد نسخة<input id="importfile" type="file" accept="application/json,.json" hidden></label></div>'+
   '<ul class="tips"><li>اضغط مطولاً على أي منزل في الخريطة لإضافة عميل هناك.</li>'+
   '<li>أفضل طريقة لأول مرة: عند باب العميل اضغط + ثم «موقعي الحالي».</li>'+
   '<li>صدّر نسخة احتياطية من وقت لآخر، فمسح بيانات المتصفح يحذف العملاء.</li></ul>'+
   '<div class="setrow" style="margin-top:14px"><button class="btn danger" data-act="wipe">حذف كل البيانات</button></div>';
  openSheet();
}
$('#settingsbtn').addEventListener('click',openSettings);

function exportData(){
  var blob=new Blob([JSON.stringify({app:'mullingar-customers',version:1,exported:new Date().toISOString(),customers:customers},null,1)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='customers-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},4000);
  toast('تم تصدير النسخة الاحتياطية');
}
body.addEventListener('change',function(e){
  if(e.target.id!=='importfile')return;
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      var list=Array.isArray(data)?data:data.customers;
      if(!Array.isArray(list))throw new Error('bad');
      var have={};customers.forEach(function(c){have[c.id]=true});
      var added=0;
      list.forEach(function(c){
        if(c&&typeof c.lat==='number'&&typeof c.lng==='number'&&c.name!=null){
          if(c.id&&have[c.id])return;
          var id=c.id?String(c.id):uid();
          customers.push({id:id,name:String(c.name),house:String(c.house||''),eircode:normE(c.eircode),code:String(c.code||'').replace(/\D/g,'').slice(0,2),note:String(c.note||''),lat:c.lat,lng:c.lng,created:c.created||Date.now()});
          have[id]=true;added++;
        }
      });
      save();renderMarkers();openSettings();toast('تمت إضافة '+added+' عميل');
    }catch(err){toast('ملف غير صالح')}
  };
  r.readAsText(f);
});

/* ---------- start ---------- */
load();renderMarkers();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
</body>
</html>
